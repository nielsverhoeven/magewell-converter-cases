name: Setup Bambu Studio
description: >-
  Installs the pinned Bambu Studio release (Linux AppImage, checksum-verified, cached) for headless
  slicing in CI, extracts it once, and exports MCC_BAMBU_STUDIO pointing at a wrapper that runs it
  under xvfb (the CLI still initialises GTK). Used by render.yml's slicer gate:
  `scripts/build.py slicer-check --require` slices every exported <part>.3mf with the same slicer
  and version the project files are written for (scripts/bambu_project.py BAMBU_VERSION,
  scripts/bambu/x1c-0.4-asa.project_settings.json) and fails on any slicer warning.
  Bump appimage-url, sha256 and BAMBU_VERSION together, and refresh the settings dump.

inputs:
  appimage-url:
    description: Bambu Studio Linux AppImage (Ubuntu 24.04 build, matches ubuntu-latest).
    required: false
    default: https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu24.04-v02.08.02.61-20260820225108.AppImage
  sha256:
    description: Expected sha256 of the AppImage (GitHub release asset digest).
    required: false
    default: d501b103fac5424513ec0e8d6bc145fb30719de2c7d94d7320d723740c81a7fd

runs:
  using: composite
  steps:
    - name: Cache the Bambu Studio AppImage
      uses: actions/cache@v4
      with:
        path: /tmp/bambu-studio.AppImage
        key: bambu-studio-appimage-${{ inputs.sha256 }}

    - name: Install Bambu Studio runtime libraries
      shell: bash
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          xvfb xauth \
          libgtk-3-0t64 libwebkit2gtk-4.1-0 libsoup-3.0-0 \
          libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
          libegl1 libgl1 libopengl0 libglx0 libglu1-mesa libosmesa6 \
          libfontconfig1 libfreetype6 libdbus-1-3 fontconfig fonts-dejavu-core

    - name: Install pinned Bambu Studio (AppImage)
      shell: bash
      env:
        BAMBU_APPIMAGE_URL: ${{ inputs.appimage-url }}
        BAMBU_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if [ ! -s /tmp/bambu-studio.AppImage ]; then
          curl -fsSL -o /tmp/bambu-studio.AppImage "$BAMBU_APPIMAGE_URL"
        fi
        computed="$(sha256sum /tmp/bambu-studio.AppImage | cut -d' ' -f1)"
        echo "Bambu Studio AppImage sha256: $computed"
        if [ "$computed" != "$BAMBU_SHA256" ]; then
          echo "::error::sha256 mismatch: expected $BAMBU_SHA256, got $computed"
          exit 1
        fi
        chmod +x /tmp/bambu-studio.AppImage

        # Extract ONCE (no FUSE on hosted runners). --appimage-extract-and-run would re-extract
        # 230 MB on every one of the ~34 slices.
        rm -rf /tmp/bambu && mkdir -p /tmp/bambu
        (cd /tmp/bambu && /tmp/bambu-studio.AppImage --appimage-extract >/dev/null)

        cat > /tmp/bambu-studio-wrapper.sh <<'WRAP'
        #!/usr/bin/env bash
        # Headless: the CLI slices without a window but still initialises GTK, so give it a
        # private virtual display (-a picks a free one, so parallel slices do not collide).
        exec xvfb-run -a -s "-screen 0 1280x1024x24" /tmp/bambu/squashfs-root/AppRun "$@"
        WRAP
        chmod +x /tmp/bambu-studio-wrapper.sh
        echo "MCC_BAMBU_STUDIO=/tmp/bambu-studio-wrapper.sh" >> "$GITHUB_ENV"
