name: Setup OpenSCAD
description: >-
  Installs the pinned OpenSCAD nightly (Linux AppImage) headlessly: Qt/X/OpenGL runtime libraries,
  the AppImage itself (checksum-verified), a wrapper that always injects
  --appimage-extract-and-run ahead of whatever scripts/build.py passes on the command line (GitHub
  runners have no FUSE, so the AppImage can't mount itself directly), and QT_QPA_PLATFORM=offscreen
  so the CLI export path can initialize without an X server. Factored out of render.yml so
  render.yml and release.yml install byte-identically (issue #10) — this file is the single place
  the OpenSCAD pin lives for CI; the local/Windows pin is scripts/build.py's
  WINDOWS_OPENSCAD_DEFAULT.

inputs:
  appimage-url:
    description: >-
      URL of the pinned OpenSCAD nightly AppImage snapshot. Re-pinned 2026-09-27 to the newest
      Linux x86_64 build then listed at https://files.openscad.org/snapshots/, because the previous
      pin (OpenSCAD-2025.09.12.ai27378) had been pruned from that server and returned 404. The
      snapshot server does not keep old builds forever, so this pin will 404 again once pruned:
      re-pin, or mirror the file as a release asset. The Windows dev pin (scripts/build.py
      WINDOWS_OPENSCAD_DEFAULT, "2025.09.07") is still open under
      .claude/knowledge/architecture.md §12 Q1.
    required: false
    default: https://files.openscad.org/snapshots/OpenSCAD-2026.09.23-x86_64.AppImage
  sha256:
    description: >-
      Expected sha256 of the file at appimage-url, from the matching .sha256 file at the same
      snapshots URL. If this is ever blanked out (e.g. after re-pinning appimage-url without
      re-checking the sum), verification is skipped but the computed sha256 is still printed so it
      can be pinned back in.
    required: false
    default: 033762f4e0b0de7a2c6cf2b5a12febb29d60ba62ede227d57b1c8b675a94710a

runs:
  using: composite
  steps:
    - name: Set QT_QPA_PLATFORM (headless Qt needs an offscreen platform plugin)
      shell: bash
      run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

    - name: Install OpenSCAD runtime libraries (AppImage needs system OpenGL/X/Qt libs)
      shell: bash
      run: |
        # The ubuntu runner image ships a Google Chrome apt source that intermittently fails
        # with 'Hash Sum mismatch' and aborts apt-get update; the build never installs from it.
        sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libopengl0 libglx0 libglu1-mesa \
          libxrender1 libxkbcommon0 libxkbcommon-x11-0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
          libxcb-xinerama0 libxcb-xkb1 libxcb-cursor0 libxcb-shape0 libxcb-randr0 \
          libfontconfig1 libfreetype6 libdbus-1-3 fontconfig fonts-dejavu-core

    - name: Install pinned OpenSCAD nightly (AppImage)
      shell: bash
      env:
        OPENSCAD_APPIMAGE_URL: ${{ inputs.appimage-url }}
        OPENSCAD_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/openscad.AppImage "$OPENSCAD_APPIMAGE_URL"
        chmod +x /tmp/openscad.AppImage

        computed_sha256="$(sha256sum /tmp/openscad.AppImage | cut -d' ' -f1)"
        echo "Downloaded OpenSCAD AppImage sha256: $computed_sha256"

        if [ -n "${OPENSCAD_SHA256}" ]; then
          if [ "$computed_sha256" != "$OPENSCAD_SHA256" ]; then
            echo "::error::sha256 mismatch: expected $OPENSCAD_SHA256, got $computed_sha256"
            exit 1
          fi
          echo "sha256 verified against pinned OPENSCAD_SHA256."
        else
          echo "::warning::OPENSCAD_SHA256 is empty — skipping checksum verification. Pin the value printed above."
        fi

        # AppImages need FUSE to mount themselves; GitHub-hosted runners don't have it. The
        # --appimage-extract-and-run flag makes the AppImage runtime extract-and-exec instead, but
        # it must be the FIRST argument passed to the AppImage — scripts/build.py always inserts
        # --backend=Manifold as the first OpenSCAD argument, so we can't rely on it to place this
        # flag correctly. Instead, point MCC_OPENSCAD at a tiny wrapper that always injects the
        # flag ahead of whatever build.py passes through.
        cat > /tmp/openscad-wrapper.sh <<'WRAP'
        #!/usr/bin/env bash
        exec /tmp/openscad.AppImage --appimage-extract-and-run "$@"
        WRAP
        chmod +x /tmp/openscad-wrapper.sh

        echo "MCC_OPENSCAD=/tmp/openscad-wrapper.sh" >> "$GITHUB_ENV"

    - name: Verify OpenSCAD is runnable
      shell: bash
      run: '"$MCC_OPENSCAD" --version'
