name: cad-gates

# Gates of the tool-neutral CAD path (issue #75, #80). Called by render.yml as the job `cad-gates`,
# which the required check `render` depends on, so the required check keeps its one name.
# Later pull requests of #80 add their jobs here.
#
#   tests   every pytest directory of the repository, one home for all of them: cad/tests,
#           scripts/tests, then every other cad/**/tests. OpenSCAD is installed and
#           MCC_REQUIRE_OPENSCAD=1 is set, so a test that needs the oracle fails instead of skipping.
#           A skipped test fails the job (counted from the junit files), and so does a named
#           directory that collects no test at all (pytest exit code 5).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: CAD tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with BOSL2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-step.txt

      - name: Setup OpenSCAD
        uses: ./.github/actions/setup-openscad

      - name: pytest on cad/tests, scripts/tests and every other cad/**/tests
        shell: bash
        env:
          MCC_REQUIRE_OPENSCAD: '1'
        run: |
          status=0
          mkdir -p junit
          run_dir() {
            local dir="$1" allow_empty="$2" rc=0
            echo "::group::pytest $dir"
            python -m pytest "$dir" -q --junitxml="junit/$(echo "$dir" | tr '/' '-').xml" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 5 ] && [ "$allow_empty" = "yes" ]; then rc=0; fi
            if [ "$rc" -ne 0 ]; then echo "::error::pytest $dir exited with $rc"; status=1; fi
          }
          run_dir cad/tests no
          run_dir scripts/tests no
          for dir in $(find cad -type d -name tests -not -path 'cad/tests' -not -path '*/__pycache__/*' | sort); do
            run_dir "$dir" yes
          done
          python - <<'PY' || status=1
          import glob
          import sys
          import xml.etree.ElementTree as ET

          skipped = []
          for path in sorted(glob.glob("junit/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for node in case.findall("skipped"):
                      if node.get("type") == "pytest.skip":
                          skipped.append(f"{case.get('classname')}::{case.get('name')}")
          for name in skipped:
              print(f"::error::skipped test: {name}")
          print(f"{len(skipped)} skipped test(s)")
          sys.exit(1 if skipped else 0)
          PY
          exit $status
