name: render

# Renders every discovered coupon/bracket/model, runs the 4-tier test suite (smoke -> render -> mesh
# checks -> goldens), slices every part with the pinned Bambu Studio CLI (slicer gate — fails on any
# slicer warning), converts every part to STEP, and uploads the results. On a v* tag it also
# runs the release gate (fails on any WARNING: unmeasured port). Releases themselves are no longer
# created here — release.yml (triggered on push to main) owns tagging and GitHub Releases; this
# workflow is CI/testing only (issue #10). See .claude/knowledge/architecture.md §8 (export
# policy) and §9 (test policy), and scripts/README.md for the underlying scripts/build.py command
# shapes.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with BOSL2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Guard against stray empty files
        # Agent shell commands have twice left zero-byte files with odd names (e.g. "180") in the
        # repo root. Fail fast if any tracked file is empty (the BOSL2 submodule is excluded).
        run: |
          stray="$(git ls-files -z | tr '\0' '\n' | grep -v '^lib/BOSL2' | while IFS= read -r f; do
            [ -f "$f" ] && [ ! -s "$f" ] && echo "$f"; done || true)"
          if [ -n "$stray" ]; then
            echo "::error::Tracked zero-byte files found (delete them):"; echo "$stray"; exit 1
          fi
          echo "No stray empty files."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        # requirements-step.txt (cadquery-ocp) is installed unconditionally here, not just in
        # release.yml, so `build.py step --all` below can fail the PR on a broken STEP conversion
        # (issue #10 PR-gate requirement) rather than only being checked at release time.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-step.txt

      - name: Setup OpenSCAD
        uses: ./.github/actions/setup-openscad

      - name: Build (smoke -> render --all -> check --all -> golden -> review)
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            python scripts/build.py all --release
          else
            python scripts/build.py all
          fi

      - name: Setup Bambu Studio (pinned Linux AppImage, headless)
        uses: ./.github/actions/setup-bambu-studio

      - name: Bambu Studio slicer gate (every part must slice without a slicer warning)
        # Slices every exported <part>.3mf with the real slicer (the same version the project files
        # are written for) and fails on any warning_message — "floating regions", "floating
        # cantilever", exclusion area, ... `check`'s printability gate is only an approximation;
        # this is the ground truth (architecture.md §8 rev 13). --require: never skip silently.
        run: python scripts/build.py slicer-check --require --jobs 3

      - name: STEP export (every discovered coupon/bracket/model)
        run: python scripts/build.py step --all

      - name: Upload exports
        uses: actions/upload-artifact@v4
        with:
          name: exports
          path: exports/**
          if-no-files-found: warn
