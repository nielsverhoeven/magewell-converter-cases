name: render

# The PR gate. Every discovered coupon/bracket/model part goes through the full chain —
# render (OpenSCAD) -> mesh + printability check -> golden -> Bambu Studio slicer gate -> STEP —
# and any failure blocks the PR (architecture.md §8 rev 13, §9). To keep that fast the work is
# split over parallel runners and pipelined inside each one:
#
#   smoke      Tier-2 headless asserts (tests/test_*.scad), in parallel with the shards.
#   shard 1-6  `build.py ci --shard k/6`: a cost-balanced sixth of the parts (heaviest first); on
#              each runner 3 parts are in flight at once, so one part's slicing/STEP overlaps the
#              next part's OpenSCAD render.
#   render     aggregator — succeeds only when smoke and every shard succeeded. Its name is the
#              required status check on protected `main`, so branch protection is unchanged.
#
# On a v* tag the shards also run the release gate (fail on any WARNING: unmeasured port).
# Releases themselves are created by release.yml. See scripts/README.md for build.py.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (with BOSL2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Guard against stray empty files
        # Agent shell commands have twice left zero-byte files with odd names (e.g. "180") in the
        # repo root. Fail fast if any tracked file is empty (the BOSL2 submodule is excluded).
        run: |
          stray="$(git ls-files -z | tr '\0' '\n' | grep -v '^lib/BOSL2' | while IFS= read -r f; do
            [ -f "$f" ] && [ ! -s "$f" ] && echo "$f"; done || true)"
          if [ -n "$stray" ]; then
            echo "::error::Tracked zero-byte files found (delete them):"; echo "$stray"; exit 1
          fi
          echo "No stray empty files."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Setup OpenSCAD
        uses: ./.github/actions/setup-openscad

      - name: Smoke tests (Tier 2)
        run: python scripts/build.py smoke

  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout (with BOSL2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        # requirements-step.txt (cadquery-ocp) so every part's STEP conversion is part of the gate.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-step.txt

      - name: Setup OpenSCAD
        uses: ./.github/actions/setup-openscad

      - name: Setup Bambu Studio (pinned Linux AppImage, headless)
        uses: ./.github/actions/setup-bambu-studio

      - name: Render -> check -> golden -> Bambu slicer gate -> STEP (shard ${{ matrix.shard }}/6)
        # The slicer gate slices every part's <part>.3mf with the same Bambu Studio version the
        # project files are written for and fails on any warning_message ("floating regions",
        # "floating cantilever", exclusion area, ...). Nothing is skipped: `ci` refuses to run
        # without Bambu Studio or a STEP backend.
        run: python scripts/build.py ci --shard ${{ matrix.shard }}/6 --jobs 3 ${{ startsWith(github.ref, 'refs/tags/v') && '--release' || '' }}

      - name: Upload exports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: exports-shard-${{ matrix.shard }}
          path: exports/**
          if-no-files-found: warn

  render:
    # Aggregator = the required status check. Fails unless smoke and all six shards succeeded.
    runs-on: ubuntu-latest
    needs: [smoke, shard]
    if: ${{ always() }}
    steps:
      - name: All gates green?
        run: |
          echo "smoke: ${{ needs.smoke.result }}  shards: ${{ needs.shard.result }}"
          test "${{ needs.smoke.result }}" = "success" && test "${{ needs.shard.result }}" = "success"
