name: render

# The PR gate. Every discovered coupon/bracket/model part goes through the full chain —
# render (OpenSCAD) -> mesh + printability check -> golden -> Bambu Studio slicer gate -> STEP —
# and any failure blocks the PR (architecture.md §8 rev 13, §9). To keep that fast the work is
# split over parallel runners and pipelined inside each one:
#
#   "OpenSCAD asserts (smoke tests)"   Tier-2 headless asserts (tests/test_*.scad), in parallel
#                                       with the part groups.
#   "Validate parts — group k of 6 …"  `build.py ci --group k/6`: a cost-balanced sixth of all parts
#                                       (heaviest first); per runner 3 parts are in flight, each
#                                       through OpenSCAD render -> checks -> golden -> Bambu Studio
#                                       slice -> STEP, so slicing overlaps the next part's render.
#   "CAD gates (pytest)"               cad-gates.yml (reusable): the one home of every pytest suite
#                                       (cad/tests, scripts/tests, other cad/**/tests), with OpenSCAD
#                                       installed and no test allowed to skip.
#   "Showcase renders"                 informational (issue #74): PNGs of every case and bracket from the
#                                       model-frame STLs of the part groups, uploaded as the artifact
#                                       `showcase-renders`. Not part of the `render` aggregator.
#   "Fusion snapshots up to date"      scripts/fusion_archive.py check: the committed archive/fusion/*.f3d
#                                       must carry the fingerprints of this run's STEP exports (#125,
#                                       D125.2); a PR that changes a case or bracket STEP must also
#                                       regenerate the snapshots locally (MccFusionArchive).
#   "render"                            aggregator — green only when the asserts, all six part
#                                       groups, the CAD gates and the Fusion snapshot gate are green. Its name is the required
#                                       status check on protected `main`, so it must stay `render`.
#
# On a v* tag the part groups also run the release gate (fail on any WARNING: unmeasured port).
# Releases themselves are created by release.yml. See scripts/README.md for build.py.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: OpenSCAD asserts (smoke tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (with BOSL2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Guard against stray empty files
        # Agent shell commands have twice left zero-byte files with odd names (e.g. "180") in the
        # repo root. Fail fast if any tracked file is empty (the BOSL2 submodule is excluded).
        run: |
          stray="$(git ls-files -z | tr '\0' '\n' | grep -v '^lib/BOSL2' | while IFS= read -r f; do
            [ -f "$f" ] && [ ! -s "$f" ] && echo "$f"; done || true)"
          if [ -n "$stray" ]; then
            echo "::error::Tracked zero-byte files found (delete them):"; echo "$stray"; exit 1
          fi
          echo "No stray empty files."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Setup OpenSCAD
        uses: ./.github/actions/setup-openscad

      - name: Smoke tests (Tier 2)
        run: python scripts/build.py smoke

  validate:
    name: Validate parts — group ${{ matrix.group }} of 6 (OpenSCAD render · checks · Bambu Studio slice · STEP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout (with BOSL2 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        # requirements-step.txt (cadquery-ocp) so every part's STEP conversion is part of the gate.
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-step.txt

      - name: Setup OpenSCAD
        uses: ./.github/actions/setup-openscad

      - name: Setup Bambu Studio (pinned Linux AppImage, headless)
        uses: ./.github/actions/setup-bambu-studio

      - name: OpenSCAD render -> mesh/printability checks -> golden -> Bambu Studio slice -> STEP (group ${{ matrix.group }} of 6)
        # The slicer gate slices every part's <part>.3mf with the same Bambu Studio version the
        # project files are written for and fails on any warning_message ("floating regions",
        # "floating cantilever", exclusion area, ...). Nothing is skipped: `ci` refuses to run
        # without Bambu Studio or a STEP backend.
        run: python scripts/build.py ci --group ${{ matrix.group }}/6 --jobs 3 ${{ startsWith(github.ref, 'refs/tags/v') && '--release' || '' }}

      - name: Upload exports
        # if: !cancelled() (not always()) — B8, issue #47: uploads the partial exports/summaries
        # even when a part group fails (e.g. a missing golden, issue #47 §7.2's own route to
        # producing one from CI), but the workflow's own cancel-in-progress:true must still be able
        # to skip a superseded run's partial output, which always() would upload too.
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: exports-part-group-${{ matrix.group }}
          path: exports/**
          if-no-files-found: warn

  cad-gates:
    name: CAD gates (pytest)
    uses: ./.github/workflows/cad-gates.yml

  fusion-archive:
    # PR gate (#125, D125.2): archive/fusion/manifest.json holds a fingerprint (sha256 of the STEP DATA
    # section, stable across CI runs) of every STEP the .f3d snapshots were built from. No Fusion here:
    # the snapshots are regenerated locally from this PR's CI exports (see archive/fusion/README.md).
    name: Fusion snapshots up to date (archive/fusion)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the exports of all six part groups
        uses: actions/download-artifact@v4
        with:
          pattern: exports-part-group-*
          merge-multiple: true
          path: downloaded-exports

      - name: Put the exports in exports/
        # upload-artifact stores `exports/**` relative to exports/; accept both layouts.
        run: |
          if [ -d downloaded-exports/exports ]; then src=downloaded-exports/exports; else src=downloaded-exports; fi
          mkdir -p exports
          cp -a "$src"/. exports/

      - name: Check the snapshots against the STEP fingerprints
        run: python scripts/fusion_archive.py check

  showcase:
    # Informational (issue #74): showcase PNGs of every case and bracket, made from the model-frame STLs
    # the part groups just exported. NOT in the `render` aggregator's needs, so the required check and its
    # speed stay as they are; the pictures are the workflow artifact `showcase-renders`. The release
    # workflow renders them again and attaches them to the release.
    name: Showcase renders (informational)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-render.txt

      - name: Install software OpenGL (Mesa) and a virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libxrender1 libxcursor1

      - name: Download the exports of all six part groups
        uses: actions/download-artifact@v4
        with:
          pattern: exports-part-group-*
          merge-multiple: true
          path: downloaded-exports

      - name: Put the exports in exports/
        # upload-artifact stores `exports/**` relative to exports/; accept both layouts.
        run: |
          if [ -d downloaded-exports/exports ]; then src=downloaded-exports/exports; else src=downloaded-exports; fi
          mkdir -p exports
          cp -a "$src"/. exports/

      - name: Render the showcase images
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python scripts/showcase.py --exports exports --out dist/renders

      - name: Upload the renders
        uses: actions/upload-artifact@v4
        with:
          name: showcase-renders
          path: dist/renders/*
          if-no-files-found: error

  render:
    # Aggregator = the required status check (keep the name `render`). Fails unless the OpenSCAD
    # asserts, all six part groups, the CAD gates and the Fusion snapshot gate succeeded.
    runs-on: ubuntu-latest
    needs: [smoke, validate, cad-gates, fusion-archive]
    if: ${{ always() }}
    steps:
      - name: All gates green? (OpenSCAD asserts + all 6 part groups + CAD gates + Fusion snapshots)
        run: |
          echo "OpenSCAD asserts: ${{ needs.smoke.result }}  part groups: ${{ needs.validate.result }}  CAD gates: ${{ needs.cad-gates.result }}  Fusion snapshots: ${{ needs.fusion-archive.result }}"
          test "${{ needs.smoke.result }}" = "success" && test "${{ needs.validate.result }}" = "success" && test "${{ needs.cad-gates.result }}" = "success" && test "${{ needs.fusion-archive.result }}" = "success"
